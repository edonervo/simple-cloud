name: secret-check

# The backstop for everything the pre-commit hook cannot cover: a commit made with
# --no-verify, a clone where the hook was never installed, a merge from a machine that had
# no hook, and a .gitignore rule edited after the fact.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC — catches a secret that predates the guard

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Load-bearing: a shallow clone has almost no history, and the history scan would
          # then report a confident green over exactly the commits most likely to hold an
          # old secret.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan staged, tree, history and boundary rules
        run: python3 scripts/secret_guard.py check --scope all
