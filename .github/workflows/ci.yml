name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in ruff.toml; 3.12 is a current version. The suite is
        # standard library only and the third-party packages are not needed to run it, so
        # there is nothing to install beyond ruff.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint tooling
        run: python3 -m pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python3 -m unittest discover -s test -t . -v
