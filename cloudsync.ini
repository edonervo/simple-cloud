# cloudsync.ini — what is in sync, and how carefully.
#
# TRACKED and reviewable in diffs. No secret belongs in this file: it names remotes, and the
# credentials live in rclone's own config (see [general] rclone_config below).
#
# Every rule this file is checked against is enforced by cloudsync/config.py, which refuses to
# run on anything unsafe rather than warning about it. `cloudsync status` shows what was parsed;
# `cloudsync doctor` shows what the environment actually has.

[general]
state_dir = state

# What to do when a guardrail fires: `hold` stops the job and keeps the plan for review, `fail`
# reports and stops without keeping it. Never a third option that would proceed.
on_warning = hold

# Explicit, and deliberately not rclone's default. rclone's default path is
# ~/.config/rclone/rclone.conf, and on this machine ~/.config is a symlink into ~/.dotfiles — a
# git repository with a GitHub remote. A Google Drive OAuth token written there would be one
# `git add -A` from being published. `doctor` refuses to run if this path resolves into any git
# work tree, which is why the symlink is resolved before that check.
rclone_config = ~/.rclone/rclone.conf


# ---------------------------------------------------------------------------------------------
# Sync pairs. `mirror` makes the destination match the source, so it can delete -- which is why
# every mirror pair here carries a finite delete budget, a trash path, and an approval rule.
# ---------------------------------------------------------------------------------------------

[pair:documents]
local = /mnt/c/edo/Documents
remote = edo-gdrive-remote:Documents
mode = mirror

# A finite backstop, NOT 0. With trash_root set, a deletion becomes a move into the trash but
# still counts against --max-delete, so 0 makes the first pending deletion fatal -- under
# --dry-run too, which would hand the safety gate a truncated plan instead of a full one.
max_delete = 25

# A SIBLING of the destination, never inside it. Nested, the next run reads the trash as
# destination-only files and moves the trash into the trash.
trash_root = edo-gdrive-remote:_cloudsync-trash

# `always`: any deletion needs a human, not merely one that exceeds the budget. The budget bounds
# how much a bug can do; it authorises nothing.
approve_deletes = always

max_shrink_percent = 10
min_files = 1

# Globs that may never be deleted, at any depth. `*` crosses directory separators here, so
# `*.pdf` means "any PDF anywhere in the tree".
protect = *.pdf

# Never mirrored. Windows metadata files are regenerated by the OS and would otherwise churn the
# destination on every run.
exclude = .DS_Store, Thumbs.db, desktop.ini


[pair:books]
local = /mnt/c/edo/Books
remote = edo-gdrive-remote:Books
mode = mirror
max_delete = 25
trash_root = edo-gdrive-remote:_cloudsync-trash
approve_deletes = always
max_shrink_percent = 10
min_files = 1
protect = *.epub, *.mobi
exclude = .DS_Store, Thumbs.db, desktop.ini


[pair:projects]
local = /mnt/c/edo/Projects_toClean
remote = edo-gdrive-remote:Projects_toClean
mode = mirror
max_delete = 25
trash_root = edo-gdrive-remote:_cloudsync-trash
approve_deletes = always
max_shrink_percent = 10
min_files = 1
exclude = .DS_Store, Thumbs.db, desktop.ini


# ---------------------------------------------------------------------------------------------
# Encrypted backups are added in Phase 3, together with the crypt remote they need.
#
# They are deliberately absent here rather than present and failing: a [backup:*] section naming
# a remote that does not exist yet would make `doctor` fail for a reason that is not yet real,
# and `doctor` failing for a fake reason is how people learn to ignore it.
#
# The shape, for reference -- note `copy`, because a backup that can delete is not a backup:
#
#   [backup:documents]
#   local = /mnt/c/edo/Documents
#   remote = backup-crypt:Documents
# ---------------------------------------------------------------------------------------------
